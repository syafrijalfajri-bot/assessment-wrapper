<!DOCTYPE html>
<html>

<head>
<!-- V1.2.11 BILINGUAL RESULT + SCROLL:
     Passes the selected EN/ID language into submitAssessment() so backend
     diagnosis and summary are generated in the selected language. Also
     resets scroll to the top on Theme and Result transitions.
-->
<!-- V1.2.10 RESPONSE FIX:
     Restores the missing selectStep() response handler. Radio selections
     now write to assessmentData.responses, so Next Theme no longer reports
     answered items as unanswered.
-->
<!-- V1.2.9 LANGUAGE ROOT FIX:
     The final selectAssessmentMode override now loads the selected EN/ID
     bundle before Page 2. Single URL retained; core scoring untouched.
-->
<!-- V1.2.8 LANGUAGE REAL FIX:
     Removes the V1.2.7 duplicate lexical declarations that prevented the
     final language layer from executing. EN/ID state is authoritative and
     preserved through Home -> mode -> Information -> Theme.
-->
<!-- V1.2.7 LANGUAGE RESTORE:
     Restores the proven single-app EN/ID flow. The selected language is
     authoritative across Home, mode entry, information and assessment
     rendering. Core scoring logic is untouched.
-->
<!-- V1.2.6 LANGUAGE FIX:
     Corrected the V1.2.5 regression: no call to an undefined
     getAssessmentItems() endpoint. Page 2 waits for the known
     localized bundle endpoints and normalizes EN/ID fields.
-->
<!-- V1.2.4 LANGUAGE FIX:
     Page-2 rendering waits for the selected EN/ID assessment bundle.
     Core scoring logic remains unchanged.
-->

  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f6f8;

      color: #202124;

    }

    .app {

      max-width: 1000px;

      margin: 30px auto 60px auto;

      padding: 0 20px;

    }

    .header {

      background: white;

      padding: 28px 32px;

      border-radius: 14px;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.07);

      margin-bottom: 20px;

    }

    .header h1 {

      margin: 0 0 6px 0;

      font-size: 28px;

    }

    .subtitle {

      color: #666;

      font-size: 15px;

    }

    .version {

      margin-top: 10px;

      font-size: 12px;

      color: #888;

    }
    .analytics-chart {
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:14px;
      padding:18px;
      margin-top:14px;
    }

    .analytics-chart-title {
      font-weight:800;
      margin-bottom:4px;
    }

    .analytics-chart-note {
      color:#6b7280;
      font-size:12px;
      margin-bottom:10px;
      line-height:1.5;
    }

    .radar-wrap {
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:320px;
    }

    .bar-chart-row {
      display:grid;
      grid-template-columns:minmax(180px, 1fr) 3fr 55px;
      gap:10px;
      align-items:center;
      margin:10px 0;
      font-size:13px;
    }

    .bar-track {
      height:12px;
      background:#eef1f4;
      border-radius:20px;
      overflow:hidden;
    }

    .bar-fill {
      height:100%;
      background:#1a73e8;
      border-radius:20px;
    }

    /* Improvement roadmap: one outer card = one improvement chain.
       Internal fields are compact rows, not nested cards. */
    .improvement-roadmap-grid {
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:16px;
      margin-top:14px;
      align-items:start;
    }

    .improvement-chain {
      border:1px solid #dfe4ea;
      border-radius:14px;
      background:#fff;
      padding:16px 18px;
      margin:0;
      box-shadow:0 2px 8px rgba(0,0,0,.04);
      min-width:0;
    }

    .chain-title {
      font-weight:800;
      font-size:14px;
      margin-bottom:10px;
      padding-bottom:9px;
      border-bottom:1px solid #edf0f2;
    }

    .chain-driver {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin:0 0 9px 0;
    }

    .chain-badge {
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      padding:4px 8px;
      font-size:9px;
      font-weight:800;
      background:#f1f5f9;
      color:#475569;
    }

    .chain-node {
      border:0;
      border-radius:0;
      padding:5px 0;
      margin:0;
      background:transparent;
    }

    .chain-node + .chain-node {
      border-top:1px solid #f0f2f4;
      margin-top:2px;
      padding-top:7px;
    }

    .chain-label {
      font-size:9px;
      text-transform:uppercase;
      letter-spacing:.45px;
      font-weight:800;
      color:#6b7280;
      margin-bottom:2px;
    }

    .chain-value {
      font-size:12.5px;
      line-height:1.4;
      color:#222;
    }

    .chain-arrow {
      display:none;
    }

    @media(max-width:900px) {
      .improvement-roadmap-grid {
        grid-template-columns:1fr;
      }
    }

    .executive-grid {
      display:grid;
      grid-template-columns:180px 180px 1fr;
      gap:14px;
      margin-top:18px;
    }

    .executive-kpi {
      border:1px solid #e5e7eb;
      border-radius:14px;
      padding:18px;
      background:#fafbfc;
    }

    .executive-kpi .label {
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.5px;
      color:#6b7280;
      font-weight:800;
    }

    .executive-kpi .value {
      font-size:30px;
      font-weight:900;
      margin-top:6px;
    }

    .executive-summary {
      border:1px solid #dfe4ea;
      border-radius:14px;
      padding:18px;
      line-height:1.8;
      background:#fff;
    }

    .export-toolbar {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:15px 0 5px;
    }

    @media(max-width:700px) {
      .executive-grid {
        grid-template-columns:1fr;
      }

      .bar-chart-row {
        grid-template-columns:1fr;
        gap:5px;
      }
    }


    .progress-wrapper {

      background: white;

      padding: 18px 24px;

      border-radius: 12px;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.05);

      margin-bottom: 20px;

    }

    .progress-header {

      display: flex;

      justify-content: space-between;

      margin-bottom: 10px;

      font-size: 14px;

    }

    .progress-bar {

      height: 8px;

      background: #e5e7eb;

      border-radius: 20px;

      overflow: hidden;

    }

    .progress-fill {

      height: 100%;

      width: 0%;

      background: #1a73e8;

      transition: width 0.3s ease;

    }

    .card {

      background: white;

      padding: 30px;

      border-radius: 14px;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.07);

      margin-bottom: 20px;

    }

    .section-number {

      font-size: 13px;

      color: #1a73e8;

      font-weight: bold;

      text-transform: uppercase;

      letter-spacing: 0.5px;

    }

    .section-title {

      margin: 6px 0 8px 0;

      font-size: 24px;

    }

    .section-description {

      color: #666;

      margin-bottom: 25px;

      line-height: 1.5;

    }

    .form-group {

      margin-bottom: 22px;

    }

    .form-group label {

      display: block;

      font-weight: bold;

      margin-bottom: 8px;

    }

    .required {

      color: #d93025;

    }

    input,
    select {

      width: 100%;

      padding: 12px 14px;

      border: 1px solid #c7cbd1;

      border-radius: 7px;

      font-size: 15px;

      background: white;

    }

    .question-card {

      border: 1px solid #e0e3e7;

      border-radius: 10px;

      padding: 22px;

      margin-bottom: 20px;

    }

    .question-code {

      font-size: 13px;

      font-weight: bold;

      color: #1a73e8;

      margin-bottom: 7px;

    }

    .question-title {

      font-size: 18px;

      font-weight: bold;

      line-height: 1.5;

      margin-bottom: 7px;

    }

    .question-meta {

      font-size: 13px;

      color: #777;

      margin-bottom: 20px;

    }

    .step-option {

      display: block;

      border: 1px solid #d5d9de;

      border-radius: 9px;

      padding: 15px;

      margin-bottom: 10px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;

    }

    .step-option:hover {

      background: #f7f9fc;

      border-color: #1a73e8;

    }

    .step-option.selected {

      background: #eef5ff;

      border-color: #1a73e8;

    }

    .step-top {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 7px;

    }

    .step-top input {

      width: auto;

    }

    .step-name {

      font-weight: bold;

      font-size: 14px;

    }

    .step-guidance {

      margin-left: 28px;

      color: #555;

      line-height: 1.5;

      font-size: 14px;

    }

    .navigation {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-top: 25px;

      gap: 10px;

    }

    .btn {

      border: none;

      border-radius: 8px;

      padding: 12px 22px;

      font-size: 15px;

      cursor: pointer;

      transition:
        opacity 0.15s ease;

    }

    .btn:hover {

      opacity: 0.9;

    }

    .btn-primary {

      background: #1a73e8;

      color: white;

    }

    .btn-secondary {

      background: #e9ecef;

      color: #333;

    }

    .btn-success {

      background: #188038;

      color: white;

    }

    .btn:disabled {

      opacity: 0.5;

      cursor: not-allowed;

    }

    .alert {

      padding: 14px 16px;

      border-radius: 8px;

      margin-bottom: 20px;

      line-height: 1.5;

    }

    .alert-error {

      background: #fce8e6;

      color: #b3261e;

    }

    .alert-info {

      background: #e8f0fe;

      color: #174ea6;

    }

    .alert-success {

      background: #e6f4ea;

      color: #137333;

    }

    .review-row {

      display: grid;

      grid-template-columns: 220px 1fr;

      gap: 15px;

      padding: 10px 0;

      border-bottom: 1px solid #eee;

    }

    .review-label {

      font-weight: bold;

    }

    .review-value {

      color: #555;

    }

    .result-main {

      text-align: center;

      padding: 30px;

      border-bottom: 1px solid #eee;

      margin-bottom: 25px;

    }

    .result-main-label {

      font-size: 15px;

      color: #666;

    }

    .bms {

      font-size: 60px;

      font-weight: bold;

      margin: 10px 0;

    }

    .maturity {

      font-size: 22px;

      font-weight: bold;

      letter-spacing: 1px;

    }

    .result-grid {

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 12px;

      margin-top: 20px;

    }

    .result-theme {

      border: 1px solid #ddd;

      border-radius: 8px;

      padding: 15px;

      text-align: center;

    }

    .result-theme-title {

      font-size: 12px;

      color: #666;

      margin-bottom: 8px;

    }

    .result-theme-score {

      font-size: 25px;

      font-weight: bold;

    }

    .result-theme-level {

      font-size: 11px;

      margin-top: 5px;

      color: #666;

    }

    .priority-box {

      margin-top: 25px;

      padding: 18px;

      border-radius: 9px;

      background: #fff7e6;

      border: 1px solid #f0c36d;

    }

    .priority-title {

      font-weight: bold;

      margin-bottom: 5px;

    }

    .loading {

      text-align: center;

      padding: 60px 20px;

      color: #666;

    }

    .spinner {

      width: 35px;

      height: 35px;

      border: 4px solid #ddd;

      border-top-color: #1a73e8;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

      margin: 0 auto 15px auto;

    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

    @media (max-width: 700px) {

      .app {

        margin-top: 10px;

        padding: 0 10px;

      }

      .header,
      .card {

        padding: 20px;

      }

      .question-title {

        font-size: 16px;

      }

      .result-grid {

        grid-template-columns: 1fr;

      }

      .review-row {

        grid-template-columns: 1fr;

        gap: 5px;

      }

      .navigation {

        flex-direction: column;

        align-items: stretch;

      }

      .navigation .btn {

        width: 100%;

      }

    }

  
    /* ========================================================
       DIAGNOSIS RESULT
       ======================================================== */

    .diagnosis-section {
      margin-top: 30px;
    }

    .diagnosis-card {
      border: 1px solid #dfe3e8;
      border-radius: 12px;
      padding: 24px;
      margin-top: 20px;
      background: #fff;
    }

    .diagnosis-card.high {
      border-left: 5px solid #d93025;
    }

    .diagnosis-card.medium {
      border-left: 5px solid #f9ab00;
    }

    .diagnosis-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 18px;
    }

    .diagnosis-number {
      font-size: 11px;
      font-weight: bold;
      color: #1a73e8;
      letter-spacing: 0.8px;
      margin-bottom: 5px;
    }

    .diagnosis-theme {
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }

    .diagnosis-requirement {
      font-size: 19px;
      font-weight: bold;
      line-height: 1.4;
    }

    .diagnosis-priority {
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      background: #e8f0fe;
      color: #174ea6;
    }

    .diagnosis-priority.high {
      background: #fce8e6;
      color: #b3261e;
    }

    .diagnosis-priority.medium {
      background: #fef7e0;
      color: #8a5a00;
    }

    .diagnosis-score-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .diagnosis-metric {
      border: 1px solid #e3e6ea;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      background: #fafbfc;
    }

    .diagnosis-metric-label {
      font-size: 11px;
      color: #777;
      margin-bottom: 6px;
    }

    .diagnosis-metric-value {
      font-size: 18px;
      font-weight: bold;
    }

    .diagnosis-block {
      margin-top: 14px;
      padding: 15px;
      border-radius: 8px;
      background: #f8f9fa;
    }

    .diagnosis-interpretation {
      background: #f5f8fd;
    }

    .diagnosis-label {
      font-size: 12px;
      font-weight: bold;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 7px;
    }

    .diagnosis-pattern {
      font-weight: bold;
      font-size: 15px;
    }

    .diagnosis-text {
      font-size: 14px;
      line-height: 1.65;
      color: #333;
      white-space: pre-line;
    }

    .diagnosis-value {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
    }

    .diagnosis-two-column,
    .diagnosis-action-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (max-width: 800px) {

      .diagnosis-score-grid {
        grid-template-columns: repeat(3, 1fr);
      }

    }

    @media (max-width: 600px) {

      .diagnosis-header {
        flex-direction: column;
      }

      .diagnosis-score-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .diagnosis-two-column,
      .diagnosis-action-grid {
        grid-template-columns: 1fr;
      }

    }


    /* ========================================================
       ENTRY MODE / COMPANY COLLECTION
       ======================================================== */

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 25px;
    }

    .mode-card {
      text-align: left;
      border: 1px solid #dfe3e8;
      border-radius: 14px;
      background: #fff;
      padding: 25px;
      cursor: pointer;
      transition: all .2s ease;
      color: #222;
    }

    .mode-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
      border-color: #1a73e8;
    }

    .mode-icon {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .mode-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .mode-description {
      color: #666;
      line-height: 1.55;
      min-height: 55px;
    }

    .mode-action {
      display: inline-block;
      margin-top: 18px;
      color: #1a73e8;
      font-weight: 700;
    }

    .collection-banner {
      background: #f5f8fd;
      border: 1px solid #d7e3f5;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 20px;
      line-height: 1.55;
    }

    .collection-banner span {
      font-size: 12px;
      color: #666;
    }

    .company-next-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .company-summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 25px 0;
    }

    .summary-metric {
      border: 1px solid #e3e6ea;
      border-radius: 10px;
      padding: 16px;
      background: #fafbfc;
      text-align: center;
    }

    .summary-metric-label {
      font-size: 11px;
      color: #777;
      margin-bottom: 7px;
    }

    .summary-metric-value {
      font-size: 20px;
      font-weight: 700;
    }

    .company-requirement-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      border: 1px solid #e3e6ea;
      border-radius: 9px;
      padding: 14px 16px;
      margin-top: 9px;
      background: #fff;
    }

    .company-requirement-name {
      font-weight: 700;
      line-height: 1.45;
    }

    .company-requirement-score {
      font-size: 20px;
      font-weight: 700;
      min-width: 60px;
      text-align: center;
    }

    .distribution-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .distribution-card {
      border: 1px solid #e3e6ea;
      border-radius: 9px;
      padding: 14px;
      text-align: center;
      background: #fafbfc;
    }

    .distribution-level {
      font-size: 10px;
      font-weight: 700;
      color: #666;
    }

    .distribution-count {
      font-size: 22px;
      font-weight: 700;
      margin-top: 5px;
    }

    .distribution-percent {
      font-size: 12px;
      color: #777;
    }

    @media (max-width: 800px) {

      .mode-grid {
        grid-template-columns: 1fr;
      }

      .company-summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .distribution-grid {
        grid-template-columns: repeat(3, 1fr);
      }

    }

    @media (max-width: 600px) {

      .company-summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .distribution-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .company-requirement-row {
        align-items: flex-start;
      }

      .assessment-meta-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

    }


    .assessment-meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .assessment-meta-grid > div {
      border: 1px solid #e5e7eb;
      border-radius: 9px;
      background: #fff;
      padding: 10px 12px;
      min-width: 0;
    }

    .assessment-meta-grid span {
      display: block;
      font-size: 10px;
      color: #6b7280;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: .3px;
      margin-bottom: 4px;
    }

    .assessment-meta-grid strong {
      display: block;
      font-size: 12px;
      line-height: 1.4;
      word-break: break-word;
      color: #1f2937;
    }

    .public-access-box {
      margin-top: 18px;
      padding: 16px;
      border: 1px solid #d7e2ee;
      border-radius: 12px;
      background: #f7fbff;
    }

    .public-access-title {
      font-weight: 800;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .public-access-note {
      color: #5f6b76;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .public-access-url {
      background: #fff;
      border: 1px solid #d9e2ea;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.45;
      word-break: break-all;
    }

    .public-access-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .public-access-loading {
      color: #6b7280;
      font-size: 12px;
    }

    .public-access-success {
      margin-top: 8px;
      color: #16794a;
      font-size: 12px;
      font-weight: 700;
    }


    .app-footer {
      max-width: 1000px;
      margin: 0 auto 28px auto;
      padding: 14px 20px 0 20px;
      text-align: center;
      color: #7a7f85;
      font-size: 11px;
      line-height: 1.5;
      border-top: 1px solid #dfe3e8;
    }

<script>


// ============================================================
// GLOBAL STATE
// ============================================================

let assessmentItems = [];

let themes = [];

let currentPage = 0;

let isSubmitting = false;

let assessmentMode = "";

let companyCollection = null;


let assessmentData = {

  respondentName: "",
  organization: "",
  location: "",
  unit: "",
  position: "",
  assessor: "",
  targetStep: "",
  assessmentDate: "",
  assessmentMode: "INDIVIDUAL",
  collectionId: "",
  responses: {},
  language: "EN"

};


// ============================================================
// INITIALIZE
// ============================================================

window.addEventListener(
  "load",
  initializeApplication
);


let languageBundleRequestId = 0;

function loadLocalizedAssessmentBundle(lang, onSuccess) {
  var requestedLang =
    String(lang || "EN").toUpperCase() === "ID" ? "ID" : "EN";
  var requestId = ++languageBundleRequestId;

  assessmentData.language = requestedLang;
  selectedAppLanguage = requestedLang;

  function current() {
    return requestId === languageBundleRequestId;
  }

  function normalizeItems(items) {
    if (!Array.isArray(items)) return [];

    return items.map(function(item) {
      var x = JSON.parse(JSON.stringify(item || {}));

      /* Preserve the bilingual master fields whenever available. */
      var themeEN = x.themeEN || "";
      var themeID = x.themeID || "";
      var reqEN = x.requirementEN || x.questionEN || "";
      var reqID = x.requirementID || x.questionIDText || x.questionID || "";

      var en = Array.isArray(x.stepsEN)
        ? x.stepsEN
        : (Array.isArray(x.guidanceEN) ? x.guidanceEN : []);

      var id = Array.isArray(x.stepsID)
        ? x.stepsID
        : (Array.isArray(x.guidanceIDN)
          ? x.guidanceIDN
          : (Array.isArray(x.guidanceID) ? x.guidanceID : []));

      x.themeEN = themeEN;
      x.themeID = themeID;
      x.requirementEN = reqEN;
      x.requirementID = reqID;
      x.stepsEN = en;
      x.stepsID = id;
      x.guidanceEN = en;
      x.guidanceID = id;
      x.guidanceIDN = id;

      /* These are the active-language fields used by legacy renderers. */
      x.theme = requestedLang === "ID" ? (themeID || x.theme || "") : (themeEN || x.theme || "");
      x.requirement = requestedLang === "ID" ? (reqID || x.requirement || "") : (reqEN || x.requirement || "");
      x.question = x.requirement;
      x.guidance = requestedLang === "ID" ? id : en;

      return x;
    });
  }

  function apply(items, config) {
    if (!current()) return false;

    var normalized = normalizeItems(items);
    if (!normalized.length) return false;

    assessmentItems = normalized;

    var namesEN = {
      1:"Guidelines and leadership",
      2:"Knowledge and skills",
      3:"Main and support processes",
      4:"Cooperation with external parties",
      5:"Learning and improvement"
    };
    var namesID = {
      1:"Pedoman dan kepemimpinan",
      2:"Pengetahuan dan keterampilan",
      3:"Proses utama dan pendukung",
      4:"Kerja sama dengan pihak eksternal",
      5:"Pembelajaran dan perbaikan"
    };

    themes = [1,2,3,4,5].map(function(no) {
      var first = normalized.filter(function(x) {
        return Number(x.themeNo) === no;
      })[0];

      return {
        no:no,
        name: requestedLang === "ID"
          ? ((first && first.themeID) || namesID[no])
          : ((first && first.themeEN) || namesEN[no]),
        nameEN: (first && first.themeEN) || namesEN[no],
        nameID: (first && first.themeID) || namesID[no]
      };
    });

    assessmentData.language = requestedLang;
    selectedAppLanguage = requestedLang;

    if (typeof onSuccess === "function") {
      onSuccess({items:assessmentItems, config:config || {themes:themes}});
    }
    return true;
  }

  /*
   * Use the bilingual/localized adapter that actually exists in the
   * approved backend. Do not call an undefined getAssessmentItems().
   */
  google.script.run
    .withSuccessHandler(function(bundle) {
      if (!current()) return;

      if (bundle && Array.isArray(bundle.items) && bundle.items.length) {
        if (apply(bundle.items, bundle.config)) return;
      }

      /* Fallback for older deployed Code.gs versions. */
      google.script.run
        .withSuccessHandler(function(items) {
          if (!current()) return;

          google.script.run
            .withSuccessHandler(function(config) {
              if (!current()) return;
              apply(items, config);
            })
            .withFailureHandler(function(error) {
              if (!current()) return;
              showError(
                T(
                  "Unable to load assessment configuration: ",
                  "Gagal memuat konfigurasi assessment: "
                ) + (error && error.message ? error.message : error)
              );
            })
            .getWebConfig(requestedLang);
        })
        .withFailureHandler(function(error) {
          if (!current()) return;
          showError(
            T(
              "Unable to load assessment items: ",
              "Gagal memuat master assessment: "
            ) + (error && error.message ? error.message : error)
          );
        })
        .getWebAssessmentItems(requestedLang);
    })
    .withFailureHandler(function() {
      if (!current()) return;

      /* Older backend: directly use the language-aware endpoint. */
      google.script.run
        .withSuccessHandler(function(items) {
          if (!current()) return;

          google.script.run
            .withSuccessHandler(function(config) {
              if (!current()) return;
              apply(items, config);
            })
            .withFailureHandler(function(error) {
              if (!current()) return;
              showError(
                T(
                  "Unable to load assessment configuration: ",
                  "Gagal memuat konfigurasi assessment: "
                ) + (error && error.message ? error.message : error)
              );
            })
            .getWebConfig(requestedLang);
        })
        .withFailureHandler(function(error) {
          if (!current()) return;
          showError(
            T(
              "Unable to load assessment items: ",
              "Gagal memuat master assessment: "
            ) + (error && error.message ? error.message : error)
          );
        })
        .getWebAssessmentItems(requestedLang);
    })
    .getLocalizedWebBundle(requestedLang);
}
function initializeApplication() {
  var initialLang = "EN";

  try {
    if (String(window.localStorage.getItem("SCL_LANGUAGE") || "").toUpperCase() === "ID") {
      initialLang = "ID";
    }
  } catch (e) {}

  if (window.__SCL_LANGUAGE__ === "ID" ||
      (window.assessmentData && assessmentData.language === "ID") ||
      window.selectedAppLanguage === "ID") {
    initialLang = "ID";
  }

  window.__SCL_LANGUAGE__ = initialLang;
  assessmentData.language = initialLang;
  selectedAppLanguage = initialLang;

  loadLocalizedAssessmentBundle(initialLang, function() {

    resolveInitialRoute(function(route) {

      if (route && route.summaryToken) {

        document.getElementById("mainContent").innerHTML =
          '<div class="card loading"><div class="spinner"></div><div>' +
          T("Opening Group Summary...", "Membuka Group Summary...") +
          '</div></div>';

        google.script.run
          .withSuccessHandler(function(summary) {
            companyCollection = {
              collectionId: summary.collection.collectionId,
              companyName: summary.collection.companyName,
              collectionName: summary.collection.collectionName,
              targetStep: summary.collection.targetStep,
              targetRespondents: summary.collection.targetRespondents
            };
            renderCompanySummaryPage(summary, true);
          })
          .withFailureHandler(function(error) {
            showError(
              T(
                "Public Group Summary could not be opened: ",
                "Public Group Summary tidak dapat dibuka: "
              ) + (error && error.message ? error.message : T("invalid access", "akses tidak valid"))
            );
          })
          .getGroupSummaryByToken(route.summaryToken);

        return;
      }

      if (route && route.assessmentToken) {

        document.getElementById("mainContent").innerHTML =
          '<div class="card loading"><div class="spinner"></div><div>' +
          T("Opening Individual Assessment Summary...", "Membuka Individual Assessment Summary...") +
          '</div></div>';

        google.script.run
          .withSuccessHandler(function(response) {
            response.viewOnly = true;
            response.publicAccess = true;

            var responseLang =
              String(response && response.language || "").toUpperCase() === "ID" ? "ID" : initialLang;

            assessmentData.language = responseLang;
            selectedAppLanguage = responseLang;
            renderResultPage(response);
          })
          .withFailureHandler(function(error) {
            showError(
              T(
                "Public Individual Summary could not be opened: ",
                "Public Individual Summary tidak dapat dibuka: "
              ) + (error && error.message ? error.message : T("invalid access", "akses tidak valid"))
            );
          })
          .getIndividualAssessmentByToken(route.assessmentToken);

        return;
      }

      if (route && route.assessmentId) {

        document.getElementById("mainContent").innerHTML =
          '<div class="card loading"><div class="spinner"></div><div>' +
          T("Loading saved assessment...", "Mengambil assessment tersimpan...") +
          '</div></div>';

        google.script.run
          .withSuccessHandler(function(response) {
            response.viewOnly = true;
            response.lookupById = true;

            var responseLang =
              String(response && response.language || "").toUpperCase() === "ID" ? "ID" : initialLang;

            assessmentData.language = responseLang;
            selectedAppLanguage = responseLang;
            renderResultPage(response);
          })
          .withFailureHandler(function(error) {
            showError(
              T(
                "Assessment ID could not be opened: ",
                "Assessment ID tidak dapat dibuka: "
              ) + (error && error.message ? error.message : T("ID not found", "ID tidak ditemukan"))
            );
          })
          .getExistingWebAssessmentForView(route.assessmentId);

        return;
      }

      if (route && route.collectionId) {
        assessmentMode = "COMPANY";
        renderJoinCompanyCollectionPage(route.collectionId, true);
      } else {
        renderModeSelection();
      }
    });
  });
}


// ============================================================
// SCROLL TO TOP
// ============================================================
//
// Dipanggil setiap kali berpindah section/theme/review/result.
// Tujuannya agar user selalu mulai dari posisi paling atas.
// ============================================================

function scrollToTop() {

  setTimeout(
    function() {

      window.scrollTo({
        top: 0,
        left: 0,
        behavior: "smooth"
      });

    },
    100
  );

}



// ============================================================
// ENTRY MODE SELECTION
// ============================================================

function legacyRenderModeSelection() {

  currentPage = 0;

  hideProgress();

  const html =
    '<div class="card mode-selection-card">' +
      '<div class="section-number">ASSESSMENT MODE</div>' +
      '<h2 class="section-title">Pilih Jenis Assessment</h2>' +
      '<div class="section-description">' +
      'Tentukan apakah assessment dilakukan untuk satu responden ' +
      'atau sebagai data collection untuk satu perusahaan / entitas.' +
      '</div>' +
      '<div class="mode-grid">' +

        '<button class="mode-card" onclick="selectAssessmentMode(\'INDIVIDUAL\')">' +
          '<div class="mode-icon">👤</div>' +
          '<div class="mode-title">INDIVIDUAL</div>' +
          '<div class="mode-description">' +
          'Satu responden → satu hasil assessment dan diagnosis individual.' +
          '</div>' +
          '<span class="mode-action">Mulai Individual →</span>' +
        '</button>' +

        '<button class="mode-card" onclick="selectAssessmentMode(\'COMPANY\')">' +
          '<div class="mode-icon">🏢</div>' +
          '<div class="mode-title">COMPANY / ENTITY</div>' +
          '<div class="mode-description">' +
          'Buat satu data collection untuk banyak responden dan hasil agregat perusahaan.' +
          '</div>' +
          '<span class="mode-action">Company / Entity →</span>' +
        '</button>' +

      '</div>' +

      '<div class="admin-lookup-card" style="margin-top:24px;padding:20px;border:1px solid #d7e2ee;border-radius:14px;background:#f7fbff;">' +
        '<div style="font-size:13px;font-weight:800;color:#1e5aa8;margin-bottom:6px;">ADMIN / INTERNAL ACCESS</div>' +
        '<div style="font-size:18px;font-weight:800;margin-bottom:6px;">Buka Assessment yang Sudah Tersimpan</div>' +
        '<div style="font-size:13px;color:#52606d;margin-bottom:14px;">' +
          'Masukkan Assessment ID untuk mencari dan melihat kembali hasil assessment yang sudah tersimpan. ' +
          'Fitur ini adalah lookup internal; Assessment ID tidak digunakan sebagai public access credential.' +
        '</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
          '<input id="adminAssessmentIdInput" type="text" placeholder="Contoh: SCL-20260812-080746-4734" ' +
            'style="flex:1;min-width:280px;padding:12px 14px;border:1px solid #cbd5e1;border-radius:9px;font-size:14px;">' +
          '<button class="btn-primary" onclick="openStoredAssessmentById()">🔎 Buka Assessment</button>' +
        '</div>' +
        '<div id="adminAssessmentLookupStatus" style="margin-top:10px;font-size:12px;color:#64748b;"></div>' +
      '</div>' +

    '</div>';

  document.getElementById(
    "mainContent"
  ).innerHTML = html;

  scrollToTop();

}


function openStoredAssessmentById() {

  const input = document.getElementById("adminAssessmentIdInput");
  const status = document.getElementById("adminAssessmentLookupStatus");
  const assessmentId = input ? String(input.value || "").trim() : "";

  if (!assessmentId) {
    if (status) {
      status.style.color = "#b42318";
      status.textContent = "Silakan masukkan Assessment ID.";
    }
    if (input) input.focus();
    return;
  }

  document.getElementById("mainContent").innerHTML =
    '<div class="card loading">' +
      '<div class="spinner"></div>' +
      '<div>Mengambil assessment tersimpan...</div>' +
    '</div>';

  google.script.run
    .withSuccessHandler(function(response) {
      if (!response) {
        renderModeSelection();
        alert("Assessment tidak ditemukan.");
        return;
      }

      response.viewOnly = true;
      response.lookupById = true;
      response.adminLookup = true;

      renderResultPage(response);
    })
    .withFailureHandler(function(error) {
      renderModeSelection();

      const msg =
        error && error.message
          ? error.message
          : "Assessment ID tidak ditemukan atau tidak dapat dibuka.";

      const status2 =
        document.getElementById("adminAssessmentLookupStatus");

      if (status2) {
        status2.style.color = "#b42318";
        status2.textContent = msg;
      }

      alert("Assessment ID tidak dapat dibuka:\n\n" + msg);
    })
    .getExistingWebAssessmentForView(assessmentId);
}


function selectAssessmentMode(mode) {
  var lang =
    String(
      window.__SCL_LANGUAGE__ ||
      selectedAppLanguage ||
      (assessmentData && assessmentData.language) ||
      "EN"
    ).toUpperCase() === "ID"
      ? "ID"
      : "EN";

  window.__SCL_LANGUAGE__ = lang;
  selectedAppLanguage = lang;

  assessmentMode = mode;

  assessmentData = {
    respondentName: "",
    organization: "",
    location: "",
    unit: "",
    position: "",
    assessor: "",
    targetStep: "",
    assessmentDate: "",
    assessmentMode: mode,
    collectionId: "",
    language: lang,
    responses: {}
  };

  /*
   * Do not enter Page 2 until the requested language bundle is ready.
   */
  loadLocalizedAssessmentBundle(lang, function() {
    window.__SCL_LANGUAGE__ = lang;
    selectedAppLanguage = lang;
    assessmentData.language = lang;

    if (mode === "COMPANY") {
      renderCompanyCollectionChoicePage();
    } else {
      renderInformationPage();
    }
  });
}


// ============================================================
// COMPANY COLLECTION CHOICE
// ============================================================
//
// One company assessment is represented by one Group ID.
// The first coordinator creates the collection. Subsequent
// respondents join the existing collection using that ID.
// ============================================================

function renderCompanyCollectionChoicePage() {

  hideProgress();

  let html = "";

  html += '<div class="card">';

  html +=
    '<div class="section-number">' +
    'COMPANY / ENTITY ASSESSMENT' +
    '</div>';

  html +=
    '<h2 class="section-title">Pilih Aksi</h2>';

  html +=
    '<div class="section-description">' +
    'Gunakan <strong>Create New Group</strong> hanya untuk PIC/koordinator yang membuat assessment perusahaan. Responden berikutnya gunakan <strong>Join Existing Group</strong> dengan Group ID yang diberikan PIC.' +
    '</div>';

  html += '<div class="mode-grid">';

  html +=
    '<button class="mode-card" onclick="renderCompanyCollectionPage()">' +
      '<div class="mode-icon">➕</div>' +
      '<div class="mode-title">CREATE NEW COLLECTION</div>' +
      '<div class="mode-description">' +
      'Buat collection baru untuk satu perusahaan / entitas.' +
      '</div>' +
      '<span class="mode-action">Buat Collection →</span>' +
    '</button>';

  html +=
    '<button class="mode-card" onclick="renderJoinCompanyCollectionPage()">' +
      '<div class="mode-icon">🔗</div>' +
      '<div class="mode-title">JOIN EXISTING COLLECTION</div>' +
      '<div class="mode-description">' +
      'Masukkan Group ID dari PIC untuk bergabung ke assessment yang sudah dibuat.' +
      '</div>' +
      '<span class="mode-action">Masukkan Group ID →</span>' +
    '</button>';

  html += '</div>';

  html +=
    '<div class="alert alert-info">' +
    '<strong>Catatan:</strong> Semua responden yang menggunakan Group ID yang sama akan masuk ke satu kelompok Company / Entity dan nantinya dapat diagregasikan menjadi satu Group Assessment Summary.' +
    '</div>';

  html +=
    '<div class="navigation">' +
      '<button class="btn btn-secondary" onclick="renderModeSelection()">← Kembali</button>' +
    '</div>';

  html += '</div>';

  document.getElementById(
    "mainContent"
  ).innerHTML = html;

  scrollToTop();

}


// ============================================================
// JOIN EXISTING COMPANY COLLECTION
// ============================================================

function renderJoinCompanyCollectionPage(prefillCollectionId, autoVerify) {

  hideProgress();

  let html = "";

  html += '<div class="card">';

  html +=
    '<div class="section-number">JOIN EXISTING COLLECTION</div>';

  html +=
    '<h2 class="section-title">Masukkan Group ID</h2>';

  html +=
    '<div class="section-description">' +
    'Masukkan Group ID yang diberikan oleh PIC / Koordinator assessment perusahaan.' +
    '</div>';

  html += createInput(
    "joinCollectionId",
    "Group ID",
    prefillCollectionId || "",
    true
  );

  html +=
    '<div id="joinCollectionError"></div>';

  html +=
    '<div id="joinCollectionPreview"></div>';

  html +=
    '<div class="navigation">' +
      '<button class="btn btn-secondary" onclick="renderCompanyCollectionChoicePage()">← Kembali</button>' +
      '<button id="joinCollectionButton" class="btn btn-primary" onclick="joinCompanyCollectionNow()">Verifikasi Group →</button>' +
    '</div>';

  html += '</div>';

  document.getElementById(
    "mainContent"
  ).innerHTML = html;

  scrollToTop();

  if (autoVerify && prefillCollectionId) {
    setTimeout(function() {
      joinCompanyCollectionNow();
    }, 250);
  }

}


function joinCompanyCollectionNow() {

  const collectionId =
    getValue("joinCollectionId");

  const errorBox =
    document.getElementById(
      "joinCollectionError"
    );

  const preview =
    document.getElementById(
      "joinCollectionPreview"
    );

  const button =
    document.getElementById(
      "joinCollectionButton"
    );

  if (!collectionId) {
    errorBox.innerHTML =
      '<div class="alert alert-error">Group ID wajib diisi.</div>';
    return;
  }

  if (button) {
    button.disabled = true;
    button.innerText = "Memverifikasi...";
  }

  if (errorBox) errorBox.innerHTML = "";
  if (preview) preview.innerHTML =
    '<div class="card loading"><div class="spinner"></div><div>Memeriksa Group ID...</div></div>';

  google.script.run
    .withSuccessHandler(function(result) {

      companyCollection = result;

      assessmentMode = "COMPANY";

      assessmentData = {
        respondentName: "",
        organization: result.companyName || "",
        location: "",
        unit: "",
        position: "",
        targetStep: String(result.targetStep || ""),
        assessmentDate: "",
        assessmentMode: "COMPANY",
        collectionId: result.collectionId,
        responses: {}
      };

      let confirmHtml = '';
      const completed =
        Number(result.completedRespondents || 0);

      const target =
        Number(result.targetRespondents || 0);

      const remaining =
        Number(
          result.remainingRespondents !== undefined
            ? result.remainingRespondents
            : Math.max(0, target - completed)
        );

      confirmHtml += '<div class="alert alert-success">';
      confirmHtml += '<strong>Group ditemukan ✓</strong><br>';
      confirmHtml += '<br><strong>Organisasi / Entitas:</strong> ' + escapeHtml(result.companyName || "-");
      confirmHtml += '<br><strong>Data Group:</strong> ' + escapeHtml(result.collectionName || "-");
      confirmHtml += '<br><strong>Group ID:</strong> ' + escapeHtml(result.collectionId || "-");
      confirmHtml += '<br><strong>Target Step:</strong> STEP ' + escapeHtml(String(result.targetStep || "-")) + ' – ' + escapeHtml(getStepNameClient(result.targetStep));
      confirmHtml += '<br><strong>Progress Responden:</strong> ' + completed + ' / ' + target;
      if (target > 0) {
        confirmHtml += '<br><strong>Sisa Responden:</strong> ' + remaining;
      }
      confirmHtml += '</div>';

      confirmHtml += '<div class="navigation" style="display:flex;gap:10px;flex-wrap:wrap;">';
      confirmHtml += '<button class="btn btn-secondary" onclick="renderCompanyCollectionChoicePage()">← Batal</button>';

      if (remaining > 0 || target === 0) {
        confirmHtml += '<button class="btn btn-primary" onclick="continueJoinedCompanyAssessment()">Lanjutkan Assessment →</button>';
      }

function getWebAppBaseUrl() {
  // IMPORTANT:
  // window.location on an Apps Script HTMLService page can be an internal
  // userCodeAppPanel URL. That URL is NOT suitable for sharing/QR.
  // Prefer the canonical deployed /exec URL returned by Apps Script.
  if (window.__canonicalWebAppUrl) {
    return window.__canonicalWebAppUrl;
  }

  // Fallback only for an already-canonical URL.
  const p = window.location.pathname || "";
  if (p.indexOf("/macros/s/") >= 0 && p.indexOf("/exec") >= 0) {
    return window.location.origin + p;
  }

  return "";
}

function getCollectionJoinUrl(collectionId) {
  const baseUrl = getWebAppBaseUrl();
  if (!baseUrl) return "";

  return baseUrl +
    "?mode=join&collectionId=" +
    encodeURIComponent(collectionId);
}

  navigator.clipboard.writeText(value).then(function() {
    const box = document.getElementById("collectionCopyStatus");
    if (box) box.innerText = "Group ID berhasil disalin.";
  }).catch(function() {
    const box = document.getElementById("collectionCopyStatus");
    if (box) box.innerText = "Group ID: " + value;
  });
}

function copyCollectionJoinLink() {
  const value = window.__activeCollectionJoinUrl || "";
  if (!value) return;
  navigator.clipboard.writeText(value).then(function() {
    const box = document.getElementById("collectionCopyStatus");
    if (box) box.innerText = "Link responden berhasil disalin.";
  }).catch(function() {
    const box = document.getElementById("collectionCopyStatus");
    if (box) box.innerText = value;
  });

function openSummaryAccessLink() {
  const value = window.__activeSummaryUrl || "";
  if (!value) {
    copySummaryAccessLink();
    return;
  }
  window.open(value, "_blank");
}


function copySummaryAccessLink() {

  const value =
    window.__activeSummaryUrl || "";

  if (!value) {

    google.script.run
      .withSuccessHandler(function(result) {

        window.__activeSummaryUrl =
          result.summaryUrl || "";

        copySummaryAccessLink();

      })
      .withFailureHandler(function(error) {
        alert(
          error && error.message
            ? error.message
            : "Gagal membuat Summary Link."
        );
      })
      .getSummaryAccessInfo(
        window.__activeCollectionId || ""
      );

    return;
  }

  navigator.clipboard.writeText(value)
    .then(function() {

      const box =
        document.getElementById(
          "collectionCopyStatus"
        );

      if (box) {
        box.innerText =
          "Summary Link berhasil disalin.";
      }

    })
    .catch(function() {

      const box =
        document.getElementById(
          "collectionCopyStatus"
        );

      if (box) {

      }

function createCompanyCollectionNow() {

  const companyName =
    getValue("companyName");

  const collectionName =
    getValue("collectionName");

  const coordinator =
    getValue("coordinator");

  const targetRespondents =
    Number(getValue("targetRespondents"));

  const targetStep =
    document.getElementById(
      "companyTargetStep"
    ).value;

  const notes =
    getValue("companyNotes");

  const errors = [];

  if (!companyName)
    errors.push("Nama Perusahaan / Entitas harus diisi.");

  if (!collectionName)
    errors.push("Nama Data Group harus diisi.");

  if (!coordinator)
    errors.push("PIC / Koordinator harus diisi.");

  if (!targetRespondents || targetRespondents < 1)
    errors.push("Target jumlah responden harus lebih dari 0.");

  if (!targetStep)
    errors.push("Target Step harus dipilih.");

  if (errors.length) {

    document.getElementById(
      "companyCollectionError"
    ).innerHTML =
      '<div class="alert alert-error">' +
      errors.map(
        function(x) {
          return "• " + escapeHtml(x);
        }
      ).join("<br>") +
      '</div>';

    return;

  }

  const button =
    document.getElementById(
      "createCollectionButton"
    );

  if (button) {
    button.disabled = true;
    button.innerText =
      "Membuat collection...";
  }

  google.script.run
    .withSuccessHandler(
      function(result) {

        companyCollection =
          result;

        assessmentData.assessmentMode =
          "COMPANY";

        assessmentData.collectionId =
          result.collectionId;

        assessmentData.organization =
          result.companyName;

        assessmentData.targetStep =
          String(result.targetStep);

        renderCollectionReadyPage(result);

      }
    )
    .withFailureHandler(
      function(error) {

        if (button) {
          button.disabled = false;
          button.innerText =
            "Buat Group & Mulai →";
        }

        document.getElementById(
          "companyCollectionError"
        ).innerHTML =
          '<div class="alert alert-error">' +
          escapeHtml(error.message) +
          '</div>';

      }
    )
    .createCompanyCollection({
      companyName: companyName,
      collectionName: collectionName,
      coordinator: coordinator,
      targetRespondents: targetRespondents,
      targetStep: Number(targetStep),
      notes: notes
    });

}

function startAssessmentLegacy() {

  const respondentName =
    getValue(
      "respondentName"
    );


  const organization =
    assessmentMode === "COMPANY"
      ? assessmentData.organization
      : getValue("organization");


  const location =
    getValue(
      "location"
    );


  const unit =
    getValue(
      "unit"
    );


  const position =
    getValue(
      "position"
    );


  const assessor =
    getValue(
      "assessor"
    );


  const targetStep =
    assessmentMode === "COMPANY"
      ? assessmentData.targetStep
      : document
          .getElementById(
            "targetStep"
          )
          .value;


  const errors = [];


  if (!respondentName) {

    errors.push(T("Respondent Name is required.", "Nama Responden harus diisi."));

  }


  if (!organization) {

    errors.push(T("Organisation / Entity is required.", "Organisasi / Entitas harus diisi."));

  }


  if (!location) {

    errors.push(T("Assessment Location is required.", "Lokasi Assessment harus diisi."));

  }


  if (!assessor) {

    errors.push(T("Assessor / Evaluator is required.", "Assessor / Evaluator harus diisi."));

  }


  if (!targetStep) {

    errors.push(T("Assessment Target Step must be selected.", "Target Step Assessment harus dipilih."));

  }


  if (errors.length) {

    document.getElementById(
      "informationError"
    ).innerHTML =

      '<div class="alert alert-error">' +

      errors
        .map(
          function(x) {

            return (
              "• " +
              escapeHtml(x)
            );

          }
        )
        .join("<br>") +

      '</div>';

    return;

  }


  assessmentData.respondentName =
    respondentName;


  assessmentData.organization =
    organization;


  assessmentData.location =
    location;


  assessmentData.unit =
    unit;


  assessmentData.position =
    position;


  assessmentData.assessor =
    assessor;


  assessmentData.targetStep =
    targetStep;

  assessmentData.assessmentMode =
    assessmentMode || "INDIVIDUAL";

  assessmentData.collectionId =
    assessmentMode === "COMPANY" &&
    companyCollection
      ? companyCollection.collectionId
      : "";

  assessmentData.assessmentDate =
    new Date().toISOString();


  currentPage = 1;


  renderThemePage();

}

function openReview() {

  const themeIndex =
    currentPage - 1;


  const theme =
    themes[themeIndex];


  const themeItems =
    assessmentItems.filter(
      function(item) {

        return (
          Number(item.themeNo) ===
          Number(theme.no)
        );

      }
    );


  const missing =
    themeItems.filter(
      function(item) {

        return !assessmentData.responses[
          getItemKey(item)
        ];

      }
    );


  if (missing.length) {

    document.getElementById(
      "themeError"
    ).innerHTML =

      '<div class="alert alert-error">' +

      'Masih ada ' +
      missing.length +
      ' pertanyaan yang belum dijawab pada Theme ini.' +

      '</div>';

    return;

  }


  renderReviewPage();

}

function submitAssessmentNow() {

  if (isSubmitting) {

    return;

  }


  const button =
    document.getElementById(
      "submitButton"
    );


  isSubmitting =
    true;


  if (button) {

    button.disabled =
      true;

    button.innerText =
      "Menyimpan & menghitung...";

  }


  const payload = {

    respondentName:
      assessmentData.respondentName,

    organization:
      assessmentData.organization,

    location:
      assessmentData.location,

    unit:
      assessmentData.unit,

    position:
      assessmentData.position,

    assessor:
      assessmentData.assessor,

    targetStep:
      Number(
        assessmentData.targetStep
      ),

    assessmentDate:
      assessmentData.assessmentDate,

    assessmentMode:
      assessmentData.assessmentMode,

    collectionId:
      assessmentData.collectionId,

    language:
      assessmentData.language || selectedAppLanguage || "EN",

    responses:
      assessmentData.responses

  };


  google.script.run

    .withSuccessHandler(
      function(response) {

        isSubmitting =
          false;


        if (
          response &&
          response.status ===
          "SUCCESS"
        ) {

          renderResultPage(
            response
          );

        }
        else {

          showSubmitError(
            "Assessment berhasil dikirim tetapi hasil tidak diterima."
          );

        }

      }
    )

    .withFailureHandler(
      function(error) {

        isSubmitting =
          false;


        if (button) {

          button.disabled =
            false;

          button.innerText =
            "Submit Assessment";

        }


        showSubmitError(
          error.message
        );

      }
    )

    .submitAssessment(
      payload
    );

}

function renderRadarChart(themeScores, title) {

  const scores = [];
  for (let i = 1; i <= 5; i++) {
    scores.push(
      Number(
        themeScores && themeScores[i] !== undefined
          ? themeScores[i]
          : 0
      )
    );
  }

  const cx = 180;
  const cy = 155;
  const maxR = 105;
  const maxScore = 5;

  function point(index, radius) {
    const angle =
      (-Math.PI / 2) +
      (index * 2 * Math.PI / 5);

    return {
      x: cx + radius * Math.cos(angle),
      y: cy + radius * Math.sin(angle)
    };
  }

  let svg =
    '<div class="analytics-chart">' +
      '<div class="analytics-chart-title">' +
      escapeHtml(title || "Theme Profile") +
      '</div>' +
      '<div class="analytics-chart-note">' +
      ((String((window.assessmentData && window.assessmentData.language) || window.selectedAppLanguage || "EN").toUpperCase() === "EN")
        ? "Five-theme profile; used to view balance and priority areas."
        : "Profil lima tema; digunakan untuk melihat keseimbangan dan area prioritas.") +
      '</div>' +
      '<div class="radar-wrap">' +
      '<svg viewBox="0 0 360 320" width="360" height="320" role="img">';

  // Grid
  [1,2,3,4,5].forEach(function(level) {

    const r = maxR * level / maxScore;
    const pts = [];

    for (let i = 0; i < 5; i++) {
      const p = point(i, r);
      pts.push(p.x.toFixed(1) + "," + p.y.toFixed(1));
    }

    svg +=
      '<polygon points="' + pts.join(" ") +
      '" fill="none" stroke="#d8dde3" stroke-width="1"/>';

  });

  // Axes and labels
  for (let i = 0; i < 5; i++) {

    const p = point(i, maxR);
    const labelP = point(i, maxR + 24);

    svg +=
      '<line x1="' + cx + '" y1="' + cy +
      '" x2="' + p.x.toFixed(1) +
      '" y2="' + p.y.toFixed(1) +
      '" stroke="#d8dde3" stroke-width="1"/>' +
      '<text x="' + labelP.x.toFixed(1) +
      '" y="' + labelP.y.toFixed(1) +
      '" text-anchor="middle" font-size="11" fill="#555">T' +
      (i + 1) + '</text>';

  }

  const valuePoints = scores.map(function(score, i) {

    const p =
      point(
        i,
        Math.max(0, Math.min(maxScore, score)) *
        maxR / maxScore
      );

    return p.x.toFixed(1) + "," + p.y.toFixed(1);

  });

  svg +=
    '<polygon points="' + valuePoints.join(" ") +
    '" fill="rgba(26,115,232,.16)" stroke="#1a73e8" stroke-width="2"/>';

  scores.forEach(function(score, i) {

    const p =
      point(
        i,
        Math.max(0, Math.min(maxScore, score)) *
        maxR / maxScore
      );

    svg +=
      '<circle cx="' + p.x.toFixed(1) +
      '" cy="' + p.y.toFixed(1) +
      '" r="4" fill="#1a73e8"/>' +
      '<text x="' + p.x.toFixed(1) +
      '" y="' + (p.y - 9).toFixed(1) +
      '" text-anchor="middle" font-size="10" font-weight="700" fill="#333">' +
      formatScore(score) + '</text>';

  });

  svg +=
      '</svg>' +
      '</div>' +
    '</div>';

  return svg;
}


function renderHorizontalBarChart(rows, title, note) {

  const data =
    Array.isArray(rows) ? rows.slice(0, 10) : [];

  if (!data.length) return "";

  const max =
    Math.max.apply(
      null,
      data.map(function(x) {
        return Number(x.score || 0);
      })
    ) || 1;

  let html =
    '<div class="analytics-chart">' +
      '<div class="analytics-chart-title">' +
      escapeHtml(title || "") +
      '</div>' +
      '<div class="analytics-chart-note">' +
      escapeHtml(note || "") +
      '</div>';

  data.forEach(function(item) {

    const score =
      Number(item.score || 0);

    const width =
      Math.max(0, Math.min(100, score / max * 100));

    html +=
      '<div class="bar-chart-row">' +
        '<div>' + escapeHtml(item.label || "-") + '</div>' +
        '<div class="bar-track">' +
          '<div class="bar-fill" style="width:' + width + '%;"></div>' +
        '</div>' +
        '<div style="text-align:right;font-weight:800;">' +
          formatScore(score) +
        '</div>' +
      '</div>';

  });

  html += '</div>';

  return html;
}

function downloadBlob(filename, content, mimeType) {

  const blob =
    new Blob(
      [content],
      {type: mimeType}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(function() {
    URL.revokeObjectURL(url);
  }, 1000);

}

function formatAssessmentDate(value) {

  if (!value) return "-";

  try {

    const d = new Date(value);

    if (isNaN(d.getTime())) {
      return String(value);
    }

    return d.toLocaleString(
      "id-ID",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }
  catch (e) {

    return String(value);

  }

}


function localizeMaturityClient(value) {
  var raw = String(value || "").trim();
  var lang = String(
    (window.assessmentData && window.assessmentData.language) ||

    "Patologis": "Pathological",

    "patologis": "Pathological",
    "patologikal": "Pathological",
    "Reaktif": "Reactive",
    "reaktif": "Reactive",
    "Kalkulatif": "Calculative",
    "kalkulatif": "Calculative",
    "Proaktif": "Proactive",

    "Generatif": "Generative",

    "CALCULATIVE": "Calculative",

  // ----------------------------------------------------------

  html +=
    '<div class="diagnosis-section">' +
    '<h2 style="margin-top:35px;">Diagnosis Analysis</h2>' +
    '<div class="section-description">' +
    'Diagnosis dihasilkan langsung dari hasil assessment. ' +
    'Tidak terdapat follow-up question tambahan.' +
    '</div>';

  if (
    diagnosis &&
    diagnosis.status === "SUCCESS" &&
    Array.isArray(diagnosis.items) &&
    diagnosis.items.length
  ) {

    html +=
      '<div class="alert alert-info">' +
      '<strong>Diagnosis Summary:</strong> ' +
      diagnosis.totalRequirements +
      ' requirement dianalisis; ' +
      '<strong>' +
      diagnosis.highPriorityCount +
      '</strong> High Priority dan ' +
      '<strong>' +
      diagnosis.mediumPriorityCount +
      '</strong> Medium Priority.' +
      '</div>';

    diagnosis.items.forEach(
      function(item, index) {

        html += renderDiagnosisCard(
          item,
          index + 1
        );

      }
    );

  }
  else {

    html +=
      '<div class="alert alert-info">' +
      'Diagnosis belum tersedia pada response Web App.' +
      '</div>';

  }

  html += '</div>';


  if (
    diagnosis &&
    Array.isArray(diagnosis.items)
  ) {

    const individualChains =
      diagnosis.items
        .filter(function(item) {
          return (
            item.intervention ||
            item.program ||
            item.expectedBehaviour ||
            item.expectedHSEImpact
          );
        })
        .sort(function(a, b) {

          const pa =
            a.priority === "High" ? 3 :
            a.priority === "Medium" ? 2 : 1;

          const pb =
            b.priority === "High" ? 3 :
            b.priority === "Medium" ? 2 : 1;

          return pb - pa;

        })
        .slice(0, 8)
        .map(function(item) {
          return {
            requirement: item.requirement,
            priority: item.priority,
            gap: item.gapPB,
            intervention: item.intervention,
            program: item.program,
            expectedBehaviour: item.expectedBehaviour,
            expectedHSEImpact: item.expectedHSEImpact
          };
        });

    html += renderImprovementChains(
      individualChains,
      "Individual Improvement Roadmap"
    );

  }

  // ----------------------------------------------------------
  // SCORING LOGIC
  // ----------------------------------------------------------

  html +=
    '<div class="alert alert-info" style="margin-top:30px;">' +
    '<strong>Scoring Logic:</strong><br>' +
    'Question Score = MIN(P,B)<br>' +
    'Theme Score = AVERAGE seluruh Question Score dalam Theme<br>' +
    'BMS = AVERAGE seluruh Theme Score<br>' +
    'Lowest Theme = indikator prioritas diagnosis' +
    '</div>';

  html +=
    '<div class="alert alert-success">' +
    'Assessment berhasil disimpan dan scoring serta diagnosis ' +
    'telah selesai dihitung.' +
    '</div>';

  if (
    response.assessmentMode === "COMPANY" &&
    response.collectionId
  ) {

    html +=
      '<div class="company-next-actions">' +
        '<button class="btn btn-secondary" ' +
        'onclick="startNextCompanyRespondent()">' +
        '＋ Input Responden Berikutnya' +
        '</button>' +
      '</div>';

  }

  html += '</div>';

  document.getElementById(
    "mainContent"
  ).innerHTML = html;

  if (response && response.assessmentId) {
    loadIndividualAccessLink(
      response.assessmentId
    );
  }

  if (response && response.viewOnly) {
    const accessBox =
      document.getElementById("individualAccessBox");

    if (accessBox) {
      accessBox.insertAdjacentHTML(
        "afterbegin",
        '<div class="alert alert-info" style="margin-bottom:12px;">' +
          '<strong>View Only.</strong> Hasil ini dibuka dari data assessment yang sudah tersimpan.' +
        '</div>'
      );
    }
  }

  scrollToTop();

}

function viewCompanySummary() {

  if (
    !companyCollection ||
    !companyCollection.collectionId
  ) {
    showError(
      "Group belum tersedia."
    );
    return;
  }

  const groupId =
    companyCollection.collectionId;

  const startedAt =
    Date.now();

  let timer = null;

  document.getElementById(
    "mainContent"
  ).innerHTML =
    '<div class="card loading">' +
      '<div class="spinner"></div>' +
      '<div id="groupSummaryLoadingText">' +
        'Menyiapkan Group Summary...' +
      '</div>' +
      '<div style="margin-top:8px;font-size:12px;color:#888;">' +
        'Group ID: ' +
        escapeHtml(groupId) +
      '</div>' +
    '</div>';

  timer =
    setInterval(
      function() {

        const seconds =
          Math.floor(
            (Date.now() - startedAt) / 1000
          );

        const label =
          document.getElementById(
            "groupSummaryLoadingText"
          );

        if (!label) {
          clearInterval(timer);
          return;
        }

        if (seconds >= 5) {
          label.innerHTML =
            'Mengolah data responden dan analisis Group... ' +
            '<strong>' +
            seconds +
            ' detik</strong>';
        }

      },
      1000
    );

  google.script.run
    .withSuccessHandler(
      function(summary) {

        if (timer) {
          clearInterval(timer);
        }

        renderCompanySummaryPage(
          summary
        );

      }
    )
    .withFailureHandler(
      function(error) {

        if (timer) {
          clearInterval(timer);
        }

        showError(
          "Gagal mengambil Group Summary: " +
          (
            error &&
            error.message
              ? error.message
              : "Unknown error"
          )
        );

      }
    )
    .getCompanySummary(
      groupId
    );

}




function loadLegacyAssessmentCandidates() {

  if (!companyCollection || !companyCollection.collectionId) {
    showError("Group belum tersedia.");
    return;
  }

  const box = document.getElementById("legacyAssessmentCandidates");

  if (box) {
    box.innerHTML =
      '<div class="card loading"><div class="spinner"></div>' +
      '<div>Mencari seluruh assessment dari organisasi yang sama...</div></div>';
  }

  google.script.run
    .withSuccessHandler(function(result) {

      if (!box) return;

      const candidates =
        result && Array.isArray(result.candidates)
          ? result.candidates
          : [];

      if (!candidates.length) {
        box.innerHTML =
          '<div class="alert alert-info">' +
          '<strong>Tidak ditemukan.</strong><br>' +
          'Tidak ada assessment yang tersimpan dengan nama organisasi yang sama. ' +
          'Jika Bapak yakin 3 assessment tadi ada, berarti nama organisasi saat pengisian berbeda.' +
          '</div>';
        return;
      }

      let html =
        '<div style="font-weight:700;margin-bottom:10px;">' +
        'Assessment yang ditemukan untuk <strong>' +
        escapeHtml(result.companyName || "") +
        '</strong>:' +
        '</div>' +
        '<div class="alert alert-info" style="margin-bottom:12px;">' +
        'Daftar ini <strong>tidak hanya mencari assessment tanpa Group ID</strong>. ' +
        'Assessment yang pernah masuk Collection lain juga ditampilkan agar data test lama dapat dipindahkan.' +
        '</div>';

      candidates.forEach(function(item, index) {

        const checkboxId = "legacyAssessment_" + index;
        const sameCollection = item.isCurrentCollection;
        const oldCollection = item.currentCollectionId || "";

        html +=
          '<div style="border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:8px;background:#fff;">' +
            '<label for="' + checkboxId + '" style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;">' +
              '<input type="checkbox" id="' + checkboxId + '" ' +
                'data-assessment-id="' + escapeAttribute(item.assessmentId) + '" ' +
                (sameCollection ? 'checked disabled ' : '') +
                'style="margin-top:4px;">' +
              '<span>' +
                '<strong>' + escapeHtml(item.respondentName || "-") + '</strong><br>' +
                '<small>' +
                  'Assessment ID: ' + escapeHtml(item.assessmentId || "-") +
                  '<br>Lokasi: ' + escapeHtml(item.location || "-") +
                  '<br>Unit: ' + escapeHtml(item.unit || "-") +
                  '<br>BMS: ' + formatScore(item.bms) +
                  ' — ' + escapeHtml(item.maturityLevel || "-") +
                  '<br>' +
                  (sameCollection
                    ? '<strong style="color:#16803c;">✓ Sudah di Group ini</strong>'
                    : oldCollection
                      ? '<strong style="color:#b45309;">⚠ Collection lama: ' +
                        escapeHtml(oldCollection) + '</strong>'
                      : '<span style="color:#555;">Belum terhubung ke Collection</span>') +
                '</small>' +
              '</span>' +
            '</label>' +
          '</div>';

      });

      html +=
        '<button class="btn btn-success" onclick="attachSelectedLegacyAssessments()">' +
        '🔗 Kaitkan / Pindahkan Assessment Terpilih' +
        '</button>';

      box.innerHTML = html;

    })
    .withFailureHandler(function(error) {

      if (box) {
        box.innerHTML =
          '<div class="alert alert-error">' +
          escapeHtml(
            error && error.message
              ? error.message
              : "Gagal mencari assessment lama."
          ) +
          '</div>';
      }

    })
    .getUnlinkedAssessmentsForCollection(
      companyCollection.collectionId
    );
}


function attachSelectedLegacyAssessments() {

  if (!companyCollection || !companyCollection.collectionId) {
    showError("Group belum tersedia.");
    return;
  }

  const checkboxes =
    document.querySelectorAll(
      '#legacyAssessmentCandidates input[type="checkbox"]:checked:not(:disabled)'
    );

  const ids = [];

  checkboxes.forEach(function(cb) {
    const id = cb.getAttribute("data-assessment-id");
    if (id) ids.push(id);
  });

  if (!ids.length) {
    showError("Pilih minimal satu assessment.");
    return;
  }

  if (!window.confirm(
    "Kaitkan " + ids.length +
    " assessment terpilih ke Group ini?\n\n" +
    "Jika assessment tersebut masih terhubung ke Collection test lama, " +
    "hubungannya akan dipindahkan ke Group ini."
  )) {
    return;
  }

  const box =
    document.getElementById("legacyAssessmentCandidates");

  if (box) {
    box.innerHTML =
      '<div class="card loading"><div class="spinner"></div>' +
      '<div>Mengaitkan / memindahkan assessment...</div></div>';
  }

  google.script.run
    .withSuccessHandler(function(result) {

      let message =
        "Berhasil mengaitkan " +
        result.attachedCount +
        " assessment ke Group ini.";

      if (Number(result.transferredCount || 0) > 0) {
        message +=
          "\n\n" +
          result.transferredCount +
          " assessment dipindahkan dari Collection lama.";
      }

      alert(message);

      viewCompanySummary();

    })
    .withFailureHandler(function(error) {

      if (box) {
        box.innerHTML =
          '<div class="alert alert-error">' +
          escapeHtml(
            error && error.message
              ? error.message
              : "Gagal mengaitkan assessment."
          ) +
          '</div>';
      }

    })
    .attachAssessmentsToCollection(
      companyCollection.collectionId,
      ids
    );
}

function resolveInitialRoute(callback) {

  const directSummaryToken =
    getQueryParam("summaryToken");

  const directAssessmentToken =
    getQueryParam("assessmentToken");

  const directAssessmentId =
    getQueryParam("assessmentId");

  const directId =
    getQueryParam("collectionId");

  if (directSummaryToken) {
    callback({
      summaryToken: directSummaryToken,
      assessmentToken: "",
      assessmentId: "",
      collectionId: ""
    });
    return;
  }

  if (directAssessmentToken) {
    callback({
      summaryToken: "",
      assessmentToken: directAssessmentToken,
      assessmentId: "",
      collectionId: ""
    });
    return;
  }

  if (directAssessmentId) {
    callback({
      summaryToken: "",
      assessmentToken: "",
      assessmentId: directAssessmentId,
      collectionId: ""
    });
    return;
  }

  try {

    if (
      google &&
      google.script &&
      google.script.url &&
      typeof google.script.url.getLocation === "function"
    ) {

      google.script.url.getLocation(
        function(location) {

          const params =
            (location && location.parameter) || {};

          callback({
            summaryToken:
              params.summaryToken || "",
            assessmentToken:
              params.assessmentToken || "",
            assessmentId:
              params.assessmentId || "",
            collectionId:
              params.collectionId || ""
          });

        }
      );

      return;

    }

  } catch (e) {}

  callback({
    summaryToken: "",
    assessmentToken: "",
    assessmentId: "",
    collectionId: ""
  });

}


function resolveInitialCollectionId(callback) {
  const directId = getQueryParam("collectionId");
  if (directId) {
    callback(directId);
    return;
  }

  // Apps Script HTMLService may hide the original /exec query string
  // behind an internal userCodeAppPanel URL. google.script.url is the
  // supported way to retrieve the deployed URL parameters.
  try {
    if (google && google.script && google.script.url &&
        typeof google.script.url.getLocation === "function") {

      google.script.url.getLocation(function(location) {
        const params = (location && location.parameter) || {};
        callback(params.collectionId || "");
      });
      return;
    }
  } catch (e) {}

  callback("");
}


function getQueryParam(name) {
  try {
    const params = new URLSearchParams(window.location.search || "");
    return params.get(name) || "";
  }
  catch (e) {
    return "";
  }
}

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}


function escapeJs(
  value
) {

  return String(value)

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /"/g,
      '\\"'
    )

    .replace(
      /\n/g,
      "\\n"
    )

    .replace(
      /\r/g,
      "\\r"
    );

}


function cssEscape(
  value
) {

  if (
    window.CSS &&
    typeof window.CSS.escape ===
      "function"
  ) {

    return window.CSS.escape(
      String(value)
    );

  }


  return String(value)
    .replace(
      /([!"#$%&'()*+,./:;<=>?@[\\\]^`{|}~])/g,
      "\\$1"
    );

}
