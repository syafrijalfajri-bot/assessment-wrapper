// Visible Back/Home panel + browser Back/Forward history.
// Does NOT alter scoring, diagnosis, aggregation or assessment data.
// ============================================================
let __navReady = false;
let __navRestoring = false;
let __navSuppressPush = false;

function renderNavigationPanel(options){
  options=options||{};
  var title=options.title||"Safety Culture Assessment";
  var showBack=options.showBack!==false;
  var showHome=options.showHome!==false;
  var showGroup=options.showGroup===true && !!(companyCollection&&companyCollection.collectionId);
  var html='<div class="app-navigation"><div class="app-navigation-left">';
  if(showBack) html+='<button type="button" class="nav-btn" onclick="navigateBack()">← Kembali</button>';
  if(showHome) html+='<button type="button" class="nav-btn" onclick="navigateHome()">🏠 Beranda</button>';
  html+='<span class="app-navigation-title">'+escapeHtml(title)+'</span></div><div class="app-navigation-right">';
  if(showGroup) html+='<button type="button" class="nav-btn nav-btn-primary" onclick="navigateToGroupSummary()">📊 Group Summary</button>';
  html+='</div></div>';
  return html;
}

function injectNavigationPanel(title,showGroup,showBack,showHome){
  var main=document.getElementById("mainContent");
  if(!main) return;
  var old=main.querySelector(":scope > .app-navigation");
  if(old) old.remove();
  var wrapper=document.createElement("div");
  wrapper.innerHTML=renderNavigationPanel({title:title,showGroup:!!showGroup,showBack:showBack!==false,showHome:showHome!==false});
  main.insertBefore(wrapper.firstElementChild,main.firstChild);
}

function __navState(page,extra){
  extra=extra||{};
  return Object.assign({
    sclNavigation:true,
    page:page,
    mode:assessmentMode||"",
    themeIndex:(typeof currentPage==="number"?currentPage-1:null),
    assessmentId:"",
    collectionId:(assessmentData&&assessmentData.collectionId)||((companyCollection&&companyCollection.collectionId)||""),
    viewOnly:false
  },extra);
}
function navPush(page,extra){if(__navRestoring||__navSuppressPush)return;history.pushState(__navState(page,extra),"",location.href)}
function navReplace(page,extra){history.replaceState(__navState(page,extra),"",location.href)}

function navigateBack(){
  if(history.length>1) history.back(); else navigateHome();
}
function navigateHome(){
  if(assessmentData&&assessmentData.responses&&Object.keys(assessmentData.responses).length){
    if(!confirm("Assessment yang sedang dikerjakan memiliki jawaban.\n\nKembali ke halaman utama akan meninggalkan pengisian ini.\n\nLanjutkan?")) return;
  }
  assessmentMode=""; companyCollection=null; currentPage=0;
  assessmentData={respondentName:"",organization:"",location:"",unit:"",position:"",assessor:"",targetStep:"",assessmentDate:"",assessmentMode:"INDIVIDUAL",collectionId:"",responses:{}};
  __navSuppressPush=true; renderModeSelection(); __navSuppressPush=false;
  navReplace("HOME",{mode:""});
}
function navigateToGroupSummary(){
  if(!companyCollection||!companyCollection.collectionId){showError("Group belum tersedia.");return;}
  navPush("GROUP_SUMMARY",{mode:"COMPANY",collectionId:companyCollection.collectionId});
  __navSuppressPush=true; viewCompanySummary(); __navSuppressPush=false;
}

function __navRestore(state){
  __navRestoring=true;
  try{
    if(!state||!state.sclNavigation){renderModeSelection();return;}
    if(state.mode) assessmentMode=state.mode;
    if(state.page==="HOME"){renderModeSelection();return;}
    if(state.page==="MODE_COMPANY"){renderCompanyCollectionChoicePage();return;}
    if(state.page==="COMPANY_CREATE"){renderCompanyCollectionPage();return;}
    if(state.page==="COMPANY_JOIN"){renderJoinCompanyCollectionPage(state.collectionId||"",false);return;}
    if(state.page==="INFORMATION"){renderInformationPage();return;}
    if(state.page==="THEME"){currentPage=Number(state.themeIndex||0)+1;renderThemePage();return;}
    if(state.page==="REVIEW"){renderReviewPage();return;}
    if(state.page==="RESULT"&&state.assessmentId){
      google.script.run.withSuccessHandler(function(r){if(r){r.viewOnly=true;r.lookupById=true;renderResultPage(r);}}).withFailureHandler(function(e){showError(e&&e.message?e.message:"Assessment tidak ditemukan.");}).getExistingWebAssessmentForView(state.assessmentId);
      return;
    }
    if(state.page==="GROUP_SUMMARY"&&state.collectionId){
      google.script.run.withSuccessHandler(function(s){
        if(s&&s.collection){companyCollection={collectionId:s.collection.collectionId,companyName:s.collection.companyName,collectionName:s.collection.collectionName,targetStep:s.collection.targetStep,targetRespondents:s.collection.targetRespondents};}
        renderCompanySummaryPage(s,true);

<script>
/* ============================================================
   SAFETY CULTURE ASSESSMENT PLATFORM — VERSION 1.0 FINAL
   Integrated directly into the FULL Index.html.
   ============================================================ */
(function () {
  "use strict";

  window.PLATFORM_VERSION = "1.0";
  window.SCORING_ENGINE_VERSION = "SCL2-SE-1.0";
  window.QUESTION_BANK_VERSION = "SCL2-QB-1.0";
  window.DIAGNOSIS_ENGINE_VERSION = "SCL2-DE-1.0";

  if (typeof getQueryParam === "function") {
    window.resolveInitialRoute = function (callback) {
      var directSummaryToken = getQueryParam("summaryToken");
      var directAssessmentToken = getQueryParam("assessmentToken");

      if (directSummaryToken) {
        callback({
          summaryToken: directSummaryToken,
          assessmentToken: "",
          assessmentId: "",
          collectionId: ""
        });
        return;
      }

      if (directAssessmentToken) {
        callback({
          summaryToken: "",
          assessmentToken: directAssessmentToken,
          assessmentId: "",
          collectionId: ""
        });
        return;
      }

      try {
        if (google && google.script && google.script.url &&
            typeof google.script.url.getLocation === "function") {
          google.script.url.getLocation(function (location) {
            var params = (location && location.parameter) || {};
            callback({
              summaryToken: params.summaryToken || "",
              assessmentToken: params.assessmentToken || "",
              assessmentId: "",
              collectionId: params.collectionId || ""
            });
          });
          return;
        }
      } catch (e) {}

      callback({
        summaryToken: "",
        assessmentToken: "",
        assessmentId: "",
        collectionId: ""
      });
    };
  }

  if (typeof getWebAppBaseUrl === "function") {
    window.getIndividualAssessmentUrl = function (assessmentId, token) {
      var baseUrl = getWebAppBaseUrl();
      if (!baseUrl || !token) return "";
      return baseUrl + "?assessmentToken=" + encodeURIComponent(token);
    };
  }

  if (typeof renderCompanySummaryPage === "function") {
    var originalRenderCompanySummaryPage = renderCompanySummaryPage;

    window.renderCompanySummaryPage = function (summary, isPublic) {
      var respondents =
        (summary && Array.isArray(summary.respondents))
          ? summary.respondents
          : [];

      var ids = respondents
        .map(function (r) {
          return String(r.assessmentId || "").trim();
        })
        .filter(function (id, index, arr) {
          return id && arr.indexOf(id) === index;
        });

      if (!ids.length) {
        return originalRenderCompanySummaryPage(summary, isPublic);
      }

      var tokenMap = {};
      var completed = 0;

      function finish() {
        var oldUrlHelper = window.getIndividualAssessmentUrl;

        window.getIndividualAssessmentUrl = function (assessmentId, token) {
          var id = String(assessmentId || "").trim();
          var realToken = token || tokenMap[id] || "";
          var baseUrl = getWebAppBaseUrl();
          if (!baseUrl || !realToken) return "";
          return baseUrl +
            "?assessmentToken=" +
            encodeURIComponent(realToken);
        };

        try {
          originalRenderCompanySummaryPage(summary, isPublic);
        } finally {
          window.getIndividualAssessmentUrl = oldUrlHelper;
        }
      }

      ids.forEach(function (id) {
        google.script.run
          .withSuccessHandler(function (info) {
            if (info && info.token) {
              tokenMap[id] = String(info.token);
            }
            completed++;
            if (completed >= ids.length) finish();
          })
          .withFailureHandler(function () {
            completed++;
            if (completed >= ids.length) finish();
          })
          .getIndividualAccessInfo(id);
      });
    };
  }

  function applyV1Metadata() {
    var versionEl = document.querySelector(".header .version");
    if (versionEl) {
      versionEl.textContent =
        "Platform V1.2";
    }

    var footer = document.querySelector(".app-footer");
    if (footer) {
      footer.innerHTML =
        "<strong>Safety Culture Assessment Platform</strong>" +
        " · Version 1.2" +
        " · Copyright © 2026 Syafrijal Fajri Lubis" +
        "<br><span style='font-size:10px;'>" +
        "Independent assessment tool; not an official NEN product or certification system." +
        "</span>";
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", applyV1Metadata);
  } else {
    applyV1Metadata();
  }
})();
</script>

<script>
/* ============================================================
   FINAL 40-ITEM BILINGUAL UI PATCH
   ============================================================ */
function startAssessment() {
  var lang = String(
    assessmentData.language || selectedAppLanguage || "EN"
  ).toUpperCase() === "ID" ? "ID" : "EN";

  assessmentData.language = lang;
  selectedAppLanguage = lang;

  loadLocalizedAssessmentBundle(lang, function() {
    /* Explicitly restore the language after the async server call. */
    assessmentData.language = lang;
    selectedAppLanguage = lang;
    startAssessmentLegacy();
  });
}


function renderThemePage() {
  const themeIndex = currentPage - 1;

  var lang =
    String(assessmentData.language || window.__SCL_LANGUAGE__ || "EN").toUpperCase() === "ID"
      ? "ID"
      : "EN";

  assessmentData.language = lang;
  selectedAppLanguage = lang;
  window.__SCL_LANGUAGE__ = lang;
  if (themeIndex < 0 || themeIndex >= themes.length) {
    renderReviewPage();
    return;
  }

  const theme = themes[themeIndex];
  const themeItems = assessmentItems.filter(function(item) {
    return Number(item.themeNo) === Number(theme.no);
  });

  const themeNames = {
    EN: {
      1:"Guidelines and leadership",
      2:"Knowledge and skills",
      3:"Main and support processes",
      4:"Cooperation with external parties",
      5:"Learning and improvement"
    },
    ID: {
      1:"Pedoman dan kepemimpinan",
      2:"Pengetahuan dan keterampilan",
      3:"Proses utama dan pendukung",
      4:"Kerja sama dengan pihak eksternal",
      5:"Pembelajaran dan perbaikan"
    }
  };

  const label = {
    ID:{
      theme:"TEMA",
      sub:"Sub-topik",
      p:"P — Psychological",
      b:"B — Behavioural",
      prev:"← Kembali",
      next:"Tema Berikutnya →",
      review:"Review Assessment →"
    },
    EN:{
      theme:"THEME",
      sub:"Sub-topic",
      p:"P — Psychological",
      b:"B — Behavioural",
      prev:"← Previous",
      next:"Next Theme →",
      review:"Review Assessment →"
    }
  }[lang];

  const localizedThemeName =
    themeNames[lang][Number(theme.no)] ||
    (lang === "EN" ? theme.name : theme.nameID || theme.name);

  let html = '<div class="card assessment-theme-card">';
  html += '<div class="section-number">' +
    label.theme + ' ' + theme.no + ' / ' + themes.length +
    '</div>';

  html += '<h2 class="section-title">' +
    escapeHtml(localizedThemeName || '') +
    '</h2>';

  const groups = {};

  themeItems.forEach(function(item) {
    if (!groups[item.sub]) groups[item.sub] = [];
    groups[item.sub].push(item);
  });

  Object.keys(groups).forEach(function(sub) {
    const pair = groups[sub];
    const first = pair[0];

    const localizedRequirement =
      lang === "EN"
        ? (first.requirementEN || first.requirement || "")
        : (first.requirementID || first.requirement || "");

    html += '<section class="subtopic-block">';
    html += '<div class="subtopic-title">' +
      escapeHtml(label.sub + ' ' + sub + ' — ' + localizedRequirement) +
      '</div>';

    ["P","B"].forEach(function(pb) {
      const item = pair.filter(function(x) {
        return x.pb === pb;
      })[0];

      if (!item) return;

      html += '<div class="dimension-block dimension-' +
        pb.toLowerCase() + '">';

      html += '<div class="dimension-title">' +
        (pb === "P" ? label.p : label.b) +
        '</div>';

      html += renderQuestion(item);
      html += '</div>';
    });

    html += '</section>';
  });

  html += '<div id="themeError"></div>';
  html += '<div class="navigation">';

  html += currentPage > 1
    ? '<button class="btn btn-secondary" onclick="previousTheme()">' +
      label.prev + '</button>'
    : '<div></div>';

  html += currentPage < themes.length
    ? '<button class="btn btn-primary" onclick="nextTheme()">' +
      label.next + '</button>'
    : '<button class="btn btn-success" onclick="openReview()">' +
      label.review + '</button>';

  html += '</div></div>';

  document.getElementById("mainContent").innerHTML = html;
  /* V1.2.11 SCROLL FIX: no undefined restoreThemeResponses() call. */
  updateProgress();

  /* Restore the original working navigation behavior. */
  scrollToTop();
}

function renderQuestion(item) {
  const itemKey = getItemKey(item);
  let html = '<div class="question-card compact-question">';
  for (let step=1; step<=5; step++) {
    const guidance = getGuidance(item, step);
    const selected = Number(assessmentData.responses[itemKey]) === step;
    html += '<label class="step-row ' + (selected?'selected':'') + '" data-option="' +
      escapeAttribute(itemKey + "-" + step) + '">';
    html += '<div class="step-choice"><input type="radio" name="item_' + escapeAttribute(itemKey) +
      '" value="' + step + '"' + (selected?' checked':'') +
      ' onchange="selectStep(\'' + escapeJs(itemKey) + '\',' + step + ')">';
    html += '<span class="step-name">STEP ' + step + '<br><small>' + getStepNameClient(step) + '</small></span></div>';
    html += '<div class="step-guidance">' + escapeHtml(guidance).replace(/\n/g,"<br>") + '</div>';
    html += '</label>';
  }
  return html + '</div>';
}

function getGuidance(item, step) {
  const i = step - 1;
  const lang =
    String(assessmentData.language || window.__SCL_LANGUAGE__ || "EN").toUpperCase() === "ID"
      ? "ID"
      : "EN";

  const source =
    lang === "EN"
      ? (item.stepsEN || item.guidanceEN || [])
      : (item.stepsID || item.guidanceIDN || item.guidanceID || []);

  return source[i] || "";
}

/*
 * RESPONSE HANDLER
 * Restored from the original working assessment implementation.
 * This is required by the radio buttons generated in renderQuestion().
 * It changes only the client response state and visual selection.
 */
function selectStep(itemKey, step) {
  var numericStep = Number(step);

  if (!itemKey || ![1, 2, 3, 4, 5].includes(numericStep)) {
    return;
  }

  assessmentData.responses[itemKey] = numericStep;

  for (var i = 1; i <= 5; i++) {
    var selector =
      '[data-option="' +
      cssEscape(itemKey + "-" + i) +
      '"]';

    var element = document.querySelector(selector);

    if (element) {
      if (i === numericStep) {
        element.classList.add("selected");
      } else {
        element.classList.remove("selected");
      }
    }
  }

  updateProgress();
}


const __nextThemeOriginal = nextTheme;
function nextTheme() {
  const themeIndex = currentPage - 1;
  const theme = themes[themeIndex];
  const themeItems = assessmentItems.filter(function(item){return Number(item.themeNo)===Number(theme.no);});
  const missing = themeItems.filter(function(item){return !assessmentData.responses[getItemKey(item)];});
  if (missing.length) {
    const lang = assessmentData.language === "EN" ? "EN" : "ID";
    document.getElementById("themeError").innerHTML =
      '<div class="alert alert-error">' +
      (lang==="EN" ? "There are " + missing.length + " unanswered items in this Theme."
                   : "Masih ada " + missing.length + " item yang belum dijawab pada Theme ini.") +
      '</div>';
    return;
  }
  currentPage++;
  renderThemePage();
}
</script>

<script>
/* ============================================================
   FINAL TARGETED LANGUAGE + SAVED-ASSESSMENT PATCH
   Scope ONLY:
   1. English must remain English throughout Individual flow.
   2. Saved Assessment must open from Home.
   3. Result/Diagnosis labels and narratives must follow language.
   Do not alter scoring, questions, Company flow, or layout logic.
   ============================================================ */
(function () {
  "use strict";

  function L() {
    return String(
      (window.assessmentData && window.assessmentData.language) ||
      window.selectedAppLanguage || "EN"
    ).toUpperCase() === "EN" ? "EN" : "ID";
  }

  function T(en, id) {
    return L() === "EN" ? en : id;
  }

  /* ---------- Progress ---------- */
  window.updateProgress = function () {
    if (currentPage < 1 || currentPage > themes.length) return;

    showProgress();

    var percent = Math.round((currentPage / themes.length) * 100);
    var label = document.getElementById("progressLabel");
    var pct = document.getElementById("progressPercent");
    var fill = document.getElementById("progressFill");

    if (label) {
      label.innerText =
        L() === "EN"
          ? "Theme " + currentPage + " of " + themes.length
          : "Tema " + currentPage + " dari " + themes.length;
    }

    if (pct) pct.innerText = percent + "%";
    if (fill) fill.style.width = percent + "%";
  };

  /* ---------- Theme navigation ---------- */
  window.nextTheme = function () {
    var themeIndex = currentPage - 1;
    var theme = themes[themeIndex];
    if (!theme) return;

    var themeItems = assessmentItems.filter(function (item) {
      return Number(item.themeNo) === Number(theme.no);
    });

    var missing = themeItems.filter(function (item) {
      return !assessmentData.responses[getItemKey(item)];
    });

    if (missing.length) {
      var el = document.getElementById("themeError");
      if (el) {
        el.innerHTML =
          '<div class="alert alert-error">' +
          (L() === "EN"
            ? "There are " + missing.length + " unanswered items in this Theme."
            : "Masih ada " + missing.length + " item yang belum dijawab pada Tema ini.") +
          '</div>';
      }
      return;
    }

    currentPage++;
    renderThemePage();
  };

  window.openReview = function () {
    var themeIndex = currentPage - 1;
    var theme = themes[themeIndex];
    if (!theme) return;

    var themeItems = assessmentItems.filter(function (item) {
      return Number(item.themeNo) === Number(theme.no);
    });

    var missing = themeItems.filter(function (item) {
      return !assessmentData.responses[getItemKey(item)];
    });

    if (missing.length) {
      var el = document.getElementById("themeError");

        el.innerHTML =
          '<div class="alert alert-error">' +
          (L() === "EN"
            ? "There are " + missing.length + " unanswered items in this Theme."

          '<button class="btn btn-secondary" onclick="exportCurrentSummaryToExcel()">📊 Excel</button>' +
          '<button class="btn btn-secondary" onclick="exportCurrentSummaryToPDF()">📑 PDF</button>' +
        '</div>' +

        '<div id="individualAccessBox" class="public-access-box">' +
          '<div class="public-access-title">🔗 ' + (en ? "Individual Result Access" : "Akses Hasil Individual") + '</div>' +
          '<div class="public-access-note">' +
            (en
              ? "Use this link to open the assessment result directly without re-entering the questions."
              : "Gunakan link ini untuk membuka hasil assessment langsung tanpa mengisi ulang pertanyaan.") +
          '</div>' +
          '<div id="individualAccessContent" class="public-access-loading">' +
            (en ? "Creating access link..." : "Membuat akses...") +
          '</div>' +
        '</div>' +

        '<h3>' + (en ? "Theme Profile" : "Profil Tema") + '</h3>' +
        '<div class="result-grid">';

    for (var i = 1; i <= 5; i++) {
      var score = result.themeScores ? result.themeScores[i] : null;
      html +=
        '<div class="result-theme">' +
          '<div class="result-theme-title">' + (en ? "Theme " : "Tema ") + i + '</div>' +
          '<div class="result-theme-score">' + formatScore(score) + '</div>' +
          '<div class="result-theme-level">' + getStepNameFromScore(score) + '</div>' +
        '</div>';
    }

    html +=
        '</div>' +
        '<div class="priority-box">' +
          '<div class="priority-title">' + (en ? "Priority / Lowest Theme" : "Prioritas / Tema Terendah") + '</div>' +
          '<div>' + escapeHtml(result.lowestTheme || "-") + ' — ' + formatScore(result.lowestThemeScore) + '</div>' +
          '<div style="margin-top:7px;font-size:13px;color:#666;">' +
            (en
              ? "Lowest Theme is used as a diagnostic and improvement priority indicator, not as the BMS."
              : "Tema terendah digunakan sebagai indikator prioritas diagnosis dan improvement, bukan sebagai BMS.") +
          '</div>' +
        '</div>' +

        '<div style="margin-top:25px;">' +
          reviewRow("BMS", formatScore(result.bms)) +
          reviewRow(en ? "Maturity Level" : "Tingkat Kematangan", localizeMaturityClient(result.maturityLevel || "-")) +
          reviewRow(en ? "Lowest Theme" : "Tema Terendah", result.lowestTheme || "-") +
          reviewRow(en ? "Lowest Theme Score" : "Skor Tema Terendah", formatScore(result.lowestThemeScore)) +
          reviewRow("Target Step", result.targetStep ? "STEP " + result.targetStep + " – " + getStepNameClient(result.targetStep) : "-") +
          reviewRow(en ? "Gap to Target" : "Gap terhadap Target", formatScore(result.gap)) +
        '</div>' +

        renderRadarChart(
          result.themeScores || {},
          en ? "Individual Theme Profile" : "Profil Tema Individu"
        );

    if (diagnosis && diagnosis.items && diagnosis.items.length) {
      html += renderHorizontalBarChart(
        diagnosis.items.map(function (item) {
          return {
            label: item.requirement || "-",
            score: Number(item.questionScore || 0)
          };
        }),
        en ? "Individual Requirement Profile" : "Profil Requirement Individu",
        en
          ? "Requirements with the lowest scores are shown as priority areas."
          : "Requirement dengan score terendah ditampilkan sebagai area prioritas."
      );
    }

    html +=
      '<div class="diagnosis-section">' +
        '<h2 style="margin-top:35px;">' +
          (en ? "Diagnosis Analysis" : "Analisis Diagnosis") +
        '</h2>' +
        '<div class="section-description">' +
          (en
            ? "Diagnosis is generated directly from the assessment results. No additional follow-up questions are used."
            : "Diagnosis dihasilkan langsung dari hasil assessment. Tidak terdapat follow-up question tambahan.") +
        '</div>';

    if (diagnosis && diagnosis.status === "SUCCESS" && Array.isArray(diagnosis.items) && diagnosis.items.length) {
      html +=
        '<div class="alert alert-info">' +
          '<strong>' + (en ? "Diagnosis Summary:" : "Ringkasan Diagnosis:") + '</strong> ' +
          diagnosis.totalRequirements + ' ' +
          (en ? "requirements analysed; " : "requirement dianalisis; ") +
          '<strong>' + diagnosis.highPriorityCount + '</strong> ' +
          (en ? "High Priority and " : "High Priority dan ") +
          '<strong>' + diagnosis.mediumPriorityCount + '</strong> ' +
          (en ? "Medium Priority." : "Medium Priority.") +
        '</div>';

      diagnosis.items.forEach(function (item, index) {
        html += renderDiagnosisCard(item, index + 1);
      });
    } else {
      html +=
        '<div class="alert alert-info">' +
          (en
            ? "Diagnosis is not available in the Web App response."
            : "Diagnosis belum tersedia pada response Web App.") +
        '</div>';
    }

    html += '</div>';

    if (diagnosis && Array.isArray(diagnosis.items)) {
      var chains = diagnosis.items
        .filter(function (item) {
          return item.intervention || item.program ||
                 item.expectedBehaviour || item.expectedHSEImpact;
        })
        .sort(function (a, b) {
          var pa = a.priority === "High" ? 3 : a.priority === "Medium" ? 2 : 1;
          var pb = b.priority === "High" ? 3 : b.priority === "Medium" ? 2 : 1;
          return pb - pa;
        })
        .slice(0, 8)
        .map(function (item) {
          return {
            requirement: item.requirement,
            priority: item.priority,
            gap: item.gapPB,
            primaryDriver: item.primaryDriver,
            intervention: item.intervention,
            program: item.program,
            expectedBehaviour: item.expectedBehaviour,
            expectedHSEImpact: item.expectedHSEImpact
          };
        });

      html += renderImprovementChains(
        chains,
        en ? "Individual Improvement Roadmap" : "Roadmap Perbaikan Individu"
      );
    }

    html +=
      '<div class="alert alert-info" style="margin-top:30px;">' +
        '<strong>' + (en ? "Scoring Logic:" : "Logika Penilaian:") + '</strong><br>' +
        'Question Score = MIN(P,B)<br>' +
        (en
          ? 'Theme Score = AVERAGE of Question Scores within the Theme<br>'
          : 'Theme Score = AVERAGE seluruh Question Score dalam Theme<br>') +
        (en
          ? 'BMS = AVERAGE of all Theme Scores<br>'
          : 'BMS = AVERAGE seluruh Theme Score<br>') +
        (en
          ? 'Lowest Theme = diagnostic priority indicator'
          : 'Lowest Theme = indikator prioritas diagnosis') +
      '</div>' +

      '<div class="alert alert-success">' +
        (en
          ? "Assessment has been saved and scoring and diagnosis have been completed."
          : "Assessment berhasil disimpan dan scoring serta diagnosis telah selesai dihitung.") +
      '</div>' +
      '</div>';

    document.getElementById("mainContent").innerHTML = html;

    /* Result opens from the top of the page. */
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;

    if (response && response.assessmentId) {
      loadIndividualAccessLink(response.assessmentId);
    }

    if (response && response.viewOnly) {
      var accessBox = document.getElementById("individualAccessBox");
      if (accessBox) {
        accessBox.insertAdjacentHTML(
          "afterbegin",
          '<div class="alert alert-info" style="margin-bottom:12px;">' +
            '<strong>' + (en ? "View Only." : "View Only.") + '</strong> ' +
            (en
              ? "This result was opened from a saved assessment."
              : "Hasil ini dibuka dari assessment yang sudah tersimpan.") +
          '</div>'
        );
      }
    }

    scrollToTop();
  };

  /* ---------- Saved Assessment from Home ---------- */
  window.openStoredAssessmentById = function (providedId) {
    var input =
      document.getElementById("savedAssessmentIdInput") ||
      document.getElementById("adminAssessmentIdInput");

    var id = String(providedId || (input && input.value) || "").trim();
    var homeLang = L();

    if (!id) {
      var msg = homeLang === "EN"
        ? "Please enter an Assessment ID."
        : "Silakan masukkan Assessment ID.";
      if (input) input.focus();
      alert(msg);
      return;
    }

    var main = document.getElementById("mainContent");
    if (main) {
      main.innerHTML =
        '<div class="card loading">' +
          '<div class="spinner"></div>' +
          '<div>' +
            (homeLang === "EN"
              ? "Opening saved assessment..."
              : "Membuka assessment tersimpan...") +
          '</div>' +
        '</div>';
    }

    function success(response) {
      if (!response) {
        throw new Error(
          homeLang === "EN"
            ? "The saved assessment could not be opened."
            : "Assessment tersimpan tidak dapat dibuka."
        );
      }

      response.viewOnly = true;
      response.lookupById = true;

      var stored = String(response.language || "").toUpperCase();
      assessmentData = assessmentData || {};
      assessmentData.language =
        stored === "EN" ? "EN" : (stored === "ID" ? "ID" : homeLang);
      selectedAppLanguage = assessmentData.language;

      renderResultPage(response);
    }

    function fail(error) {
      var msg = error && error.message
        ? error.message
        : (homeLang === "EN"
            ? "Assessment ID was not found or could not be opened."
            : "Assessment ID tidak ditemukan atau tidak dapat dibuka.");

      /* Second backend route for compatibility with older saved records. */
      google.script.run
        .withSuccessHandler(function (response) {
          success(response);
        })
        .withFailureHandler(function () {
          renderModeSelection();
          alert(msg);
        })
        .getExistingWebAssessment(id);
    }

    google.script.run
      .withSuccessHandler(success)
      .withFailureHandler(fail)
      .getExistingWebAssessmentForView(id);
  };

  window.openSavedAssessmentHome = function () {
    var input = document.getElementById("savedAssessmentIdInput");
    openStoredAssessmentById(input ? input.value : "");
  };

  /*
   * ROOT LANGUAGE FIX:
   * This is the LAST selectAssessmentMode override. It must load the
   * selected language bundle before Page 2 is rendered.
   */
  window.selectAssessmentMode = function (mode) {
    var lang =
      String(
        window.__SCL_LANGUAGE__ ||
        window.assessmentData.language ||
        window.selectedAppLanguage ||
        "EN"
      ).toUpperCase() === "ID"
        ? "ID"
        : "EN";

    window.__SCL_LANGUAGE__ = lang;
    selectedAppLanguage = lang;

    assessmentMode = mode;
    assessmentData = {
      respondentName: "",
      organization: "",
      location: "",
      unit: "",
      position: "",
      assessor: "",
      targetStep: "",
      assessmentDate: "",
      assessmentMode: mode,
      collectionId: "",
      language: lang,
      responses: {}
    };

    /* Wait for the selected EN/ID content before opening Page 2. */
    loadLocalizedAssessmentBundle(lang, function () {
      window.__SCL_LANGUAGE__ = lang;
      selectedAppLanguage = lang;
      assessmentData.language = lang;

      if (mode === "COMPANY") {
        renderCompanyCollectionChoicePage();
      } else {
        renderInformationPage();
      }
    });
  };

})();
</script>

</body>
</html>
